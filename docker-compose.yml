version: '3.8'

services:
  db:
    image: postgres:13
    restart: always
    environment:
      POSTGRES_USER: awanon_user
      POSTGRES_PASSWORD: awanon_password
      POSTGRES_DB: awanon_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    restart: always
    ports:
      - "5672:5672" # For application connections
      - "15672:15672" # For RabbitMQ Management UI
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password

  core_api:
    build:
      context: ./core-backend
      dockerfile: Dockerfile.api
    restart: always
    ports:
      - "3000:80" # FastAPI will run on port 80 in the container
    depends_on:
      - db
      - rabbitmq
    environment:
      DATABASE_URL: "postgresql://awanon_user:awanon_password@db:5432/awanon_db"
      RABBITMQ_HOST: "rabbitmq"
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: "user"
      RABBITMQ_PASS: "password"
    volumes:
      - ./core-backend:/app
    develop:
      watch:
        - action: sync
          path: ./core-backend
          target: /app
          ignore:
            - Dockerfile.api
            - Dockerfile.bridge
            - .git
            - __pycache__
            - tswiqon/__pycache__


  bridge:
    build:
      context: ./core-backend
      dockerfile: Dockerfile.bridge
    restart: always
    depends_on:
      - db
      - rabbitmq
    environment:
      DATABASE_URL: "postgresql://awanon_user:awanon_password@db:5432/awanon_db"
      RABBITMQ_HOST: "rabbitmq"
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: "user"
      RABBITMQ_PASS: "password"
    volumes:
      - ./core-backend:/app
    develop:
      watch:
        - action: sync
          path: ./core-backend
          target: /app
          ignore:
            - Dockerfile.api
            - Dockerfile.bridge
            - .git
            - __pycache__
            - tswiqon/__pycache__


  tswiqon_agent:
    build:
      context: ./core-backend/tswiqon
      dockerfile: Dockerfile.tswiqon
    restart: always
    depends_on:
      - rabbitmq
    environment:
      RABBITMQ_HOST: "rabbitmq"
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: "user"
      RABBITMQ_PASS: "password"
      LITELLM_MODEL_NAME: "groq/llama3-8b-8192" # Or user-preferred model like "vertex_ai/gemini-pro"
      # Ensure user provides GROQ_API_KEY or VERTEX_AI_PROJECT/VERTEX_AI_LOCATION etc.
      # For Groq:
      GROQ_API_KEY: "${GROQ_API_KEY}" # This tells Docker Compose to use the GROQ_API_KEY from your shell environment or a .env file
      # For Vertex AI (example, more may be needed):
      # GOOGLE_APPLICATION_CREDENTIALS: "/app/gcp-credentials.json" # If using a service account key file
      # VERTEX_AI_PROJECT: "${VERTEX_AI_PROJECT}"
      # VERTEX_AI_LOCATION: "${VERTEX_AI_LOCATION}"
    volumes:
      - ./core-backend/tswiqon:/app
      # - /path/to/your/local/gcp-credentials.json:/app/gcp-credentials.json # If using Vertex AI with a key file
    develop:
      watch:
        - action: sync
          path: ./core-backend/tswiqon
          target: /app
          ignore:
            - Dockerfile.tswiqon
            - .git
            - __pycache__


volumes:
  postgres_data: