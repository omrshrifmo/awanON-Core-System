# docker-compose.yml
version: '3.8'

services:
  # --- Infrastructure Services ---
  postgres:
    image: postgres:15
    container_name: awanon_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB} # Use variable from .env
      POSTGRES_USER: ${POSTGRES_USER} # Use variable from .env
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD} # Use variable from .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - awanon_network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: awanon_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672" # Management UI: http://localhost:15672
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER} # Use variable from .env
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS} # Use variable from .env
    networks:
      - awanon_network

  chromadb:
    image: chromadb/chroma:latest
    container_name: awanon_chromadb
    ports:
      - "8000:8000"
    volumes: # Basic persistence for ChromaDB standalone
        - chromadb_data:/chroma/.chroma/index # Adjust path based on ChromaDB docs if needed
    networks:
      - awanon_network

  # --- Application Services ---
  bridge:
    container_name: awanon_bridge
    build: ./bridge-backend # Points to the bridge-backend directory
    ports:
      - "3000:3000" # Bridge API port
    environment:
      # Ensure your postgres service name here is 'postgres' or 'db' to match its service definition
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672
      PORT: 3000
      # Add JWT_SECRET etc. later
    depends_on:
      - postgres # or 'db'
      - rabbitmq
    networks:
      - awanon_network

  tswiqon: # Our first sample AI company
    container_name: awanon_ai_tswiqon
    build: "./core-backend/tswiqon" # Points to the specific AI company folder (use quotes for space)
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672
      COMPANY_NAME: TswiqON
      COMPANY_QUEUE: tswiqon_tasks # Dedicated queue name for this company
    depends_on:
      - rabbitmq
    networks:
      - awanon_network
    # Add restart: unless-stopped later for resilience

volumes: # Define named volumes for data persistence
  postgres_data:
  chromadb_data:

networks: # Define a custom network for services to communicate
    awanon_network:
        driver: bridge