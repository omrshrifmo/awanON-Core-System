version: '3.8'

services:
  db:
    image: postgres:13
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    restart: always
    ports:
      - "5672:5672" # For application connections
      - "15672:15672" # For RabbitMQ Management UI
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}

  core_api:
    build:
      context: ./core-backend
      dockerfile: Dockerfile.api
    restart: always
    ports:
      - "3000:80" # FastAPI will run on port 80 in the container
    depends_on:
      - db
      - rabbitmq
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
      RABBITMQ_HOST: "rabbitmq"
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: "${RABBITMQ_DEFAULT_USER}"
      RABBITMQ_PASS: "${RABBITMQ_DEFAULT_PASS}"
    volumes:
      - ./core-backend:/app


  bridge:
    build:
      context: ./bridge-backend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3001:3000" # Bridge internal Node.js app runs on 3000, map to host 3001
    depends_on:
      - db
      - rabbitmq
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
      RABBITMQ_URL: "amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672"
    volumes:
      - ./bridge-backend:/app


  tswiqon_agent:
    build:
      context: ./core-backend/tswiqon
      dockerfile: Dockerfile.tswiqon
    restart: always
    depends_on:
      - rabbitmq
    environment:
      RABBITMQ_HOST: "rabbitmq"
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: "${RABBITMQ_DEFAULT_USER}"
      RABBITMQ_PASS: "${RABBITMQ_DEFAULT_PASS}"
      LITELLM_MODEL_NAME: "${LITELLM_MODEL_NAME}" # Or user-preferred model like "vertex_ai/gemini-pro"
      # Ensure user provides GROQ_API_KEY or VERTEX_AI_PROJECT/VERTEX_AI_LOCATION etc.
      # For Groq:
      GROQ_API_KEY: "${GROQ_API_KEY}" # This tells Docker Compose to use the GROQ_API_KEY from your shell environment or a .env file
      # For Vertex AI (example, more may be needed):
      # GOOGLE_APPLICATION_CREDENTIALS: "/app/gcp-credentials.json" # If using a service account key file
      # VERTEX_AI_PROJECT: "${VERTEX_AI_PROJECT}"
      # VERTEX_AI_LOCATION: "${VERTEX_AI_LOCATION}"
    volumes:
      - ./core-backend/tswiqon:/app
      # - /path/to/your/local/gcp-credentials.json:/app/gcp-credentials.json # If using Vertex AI with a key file

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "5173:5173" # Vite dev server
    depends_on:
      - core_api
      - bridge
    volumes:
      - ./frontend:/app
      - /app/node_modules # Prevent overwriting node_modules with host volume


volumes:
  postgres_data: